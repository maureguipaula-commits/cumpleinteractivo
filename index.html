<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instalación Interactiva</title>

<style>

/* ===== BASE ===== */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    color:#00fff2;
    overflow:hidden;

    background-image:url("fondo.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    position:relative;
}
/* overlay oscuro cyberpunk */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

/* ===== CONTENEDOR ===== */
.container{
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(0,255,255,0.3);
    box-shadow: 0 0 25px rgba(0,255,255,0.2);
    backdrop-filter: blur(10px);

    width:min(450px,90vw);

    padding:40px;
    border-radius:16px;
    text-align:center;
}
}

/* ===== TITULO ===== */
h1{
    font-weight:normal;
    text-shadow:0 0 10px #00fff2;
    margin-bottom:20px;
}

/* ===== INPUT ===== */
*{
    box-sizing:border-box;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    background:rgba(0,0,0,0.6);
    color:#00fff2;
    border:1px solid #00fff2;
    margin-bottom:15px;
}

/* ===== BOTON ===== */
button{
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
    border:1px solid #ff00ff;
    background:transparent;
    color:#ff00ff;
    transition:0.2s;
    letter-spacing:2px;
    text-transform:uppercase;
}

button:hover{
    background:#ff00ff;
    color:black;
    box-shadow:0 0 15px #ff00ff;
    transform:scale(1.05);
}

/* ===== ESTADO ===== */
#estado{
    margin-top:15px;
    color:#00fff2;
    opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

    <h1>Escribí tu mensaje</h1>

    <input id="texto" type="text" maxlength="200" placeholder="Escribí aquí...">

    <button onclick="enviar()">Enviar</button>

    <div id="estado"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWpwvtyZBlKBc-LiQoVgg9mANajQDGWVQ",
  authDomain: "visualescumple.firebaseapp.com",
  databaseURL: "https://visualescumple-default-rtdb.firebaseio.com",
  projectId: "visualescumple",
  storageBucket: "visualescumple.firebasestorage.app",
  messagingSenderId: "180153577746",
  appId: "1:180153577746:web:3b8590f0732a277a1903cb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.enviar = async function(){

    const input = document.getElementById("texto");
    const texto = input.value.trim();

    if(texto.length === 0) return;

    try{
        await push(ref(db, "mensajes"), {
            texto: texto,
            timestamp: Date.now()
        });

        document.getElementById("estado").innerHTML = "✔ Mensaje enviado";
        input.value = "";

    }catch(error){
        console.error(error);
        document.getElementById("estado").innerHTML = "✖ Error al enviar";
    }
}

document.getElementById("texto").addEventListener("keydown", (e)=>{
    if(e.key === "Enter") enviar();
});

</script>

</body>
</html>
