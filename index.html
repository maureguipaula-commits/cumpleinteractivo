<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instalación Interactiva</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
}

h1{
    font-weight:normal;
}

input{
    width:400px;
    max-width:80%;
    padding:12px;
    font-size:18px;
    margin-bottom:10px;
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}

#estado{
    margin-top:15px;
    color:#cccccc;
}

</style>
</head>

<body>

<h1>Escribí tu mensaje</h1>

<input
    id="texto"
    type="text"
    maxlength="200"
    placeholder="Escribí aquí..."
>

<button onclick="enviar()">
Enviar
</button>

<div id="estado"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWpwvtyZBlKBc-LiQoVgg9mANajQDGWVQ",
  authDomain: "visualescumple.firebaseapp.com",
  databaseURL: "https://visualescumple-default-rtdb.firebaseio.com",
  projectId: "visualescumple",
  storageBucket: "visualescumple.firebasestorage.app",
  messagingSenderId: "180153577746",
  appId: "1:180153577746:web:3b8590f0732a277a1903cb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.enviar = async function(){

    const input =
    document.getElementById("texto");

    const texto =
    input.value.trim();

    if(texto.length === 0){
        return;
    }

    try{

        await push(
            ref(db, "mensajes"),
            {
                texto: texto,
                timestamp: Date.now()
            }
        );

        document.getElementById("estado").innerHTML =
        "Mensaje enviado";

        input.value = "";

    }catch(error){

        console.error(error);

        document.getElementById("estado").innerHTML =
        "Error al enviar";

    }

}

document.getElementById("texto")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        enviar();
    }

});

</script>

</body>
</html>
