<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instalación Interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<style>

/* ===== BASE ===== */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
font-family: 'Orbitron', sans-serif;
    color: #00fff2;
    overflow: hidden;

    /* Posicionamiento relativo para que el overlay funcione bien */
    position: relative;
    width: 100%;
    min-height: 100vh;

    /* La imagen de fondo se queda en el body */
background-image: url("fondoweb.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed; /* Evita que el fondo se mueva o se deforme al hacer scroll */
}
    /* ===== ADAPTACIÓN PARA CELULARES ===== */
@media (max-width: 480px) {
    body {
        /* Centra el fondo y lo ajusta para que el ancho de la imagen encaje perfecto en el celu */
        background-position: center top; 
        background-size: auto 100%; 
    }
}

/* overlay oscuro cyberpunk */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.30);
    /* Se posiciona justo encima del fondo del body, pero detrás del contenedor */
    z-index: 1; 
}

/* ===== CONTENEDOR ===== */
.container {
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
    backdrop-filter: blur(10px);

    width: min(450px, 90vw);
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    
    /* Forzamos al contenedor a estar por encima del overlay oscuro */
    position: relative;
    z-index: 2;
}

/* ===== TITULO ===== */
h1 {
    font-weight: normal;
    text-shadow: 0 0 10px #00fff2;
    margin-bottom: 20px;
}

/* ===== INPUT ===== */
* {
    box-sizing: border-box;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: rgba(0, 0, 0, 0.6);
    color: #00fff2;
    border: 1px solid #00fff2;
    margin-bottom: 15px;
}

/* ===== BOTON ===== */
button {
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
    border: 2px solid #ff00ff; /* Borde rosa neón un poco más grueso */
    background: #000000;       /* Fondo negro puro */
    color: #ffffff;            /* Letras blancas hiper legibles */
    transition: 0.2s;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;         /* Letras en negrita para resaltar */
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
}

button:hover {
    background: #ff00ff;       /* Al pasar el mouse, se invierte al rosa neón */
    color: #000000;            /* Letras negras */
    box-shadow: 0 0 20px #ff00ff;
    transform: scale(1.05);
}

/* ===== ESTADO ===== */
#estado {
    margin-top: 15px;
    color: #00fff2;
    opacity: 1; /* Corregido de 50 a 1 (en CSS va de 0 a 1) */
}

</style>

</head>

<body>

<div class="container">

    <h1>Escribí tu mensaje lokite</h1>

    <input id="texto" type="text" maxlength="200" placeholder="Escribí acá sisi...">

    <button onclick="enviar()">Enviar</button>

    <div id="estado"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWpwvtyZBlKBc-LiQoVgg9mANajQDGWVQ",
  authDomain: "visualescumple.firebaseapp.com",
  databaseURL: "https://visualescumple-default-rtdb.firebaseio.com",
  projectId: "visualescumple",
  storageBucket: "visualescumple.firebasestorage.app",
  messagingSenderId: "180153577746",
  appId: "1:180153577746:web:3b8590f0732a277a1903cb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.enviar = async function(){

    const input = document.getElementById("texto");
    const texto = input.value.trim();

    if(texto.length === 0) return;

    try{
        await push(ref(db, "mensajes"), {
            texto: texto,
            timestamp: Date.now()
        });

        document.getElementById("estado").innerHTML = "✔ Mensaje enviado";
        input.value = "";

    }catch(error){
        console.error(error);
        document.getElementById("estado").innerHTML = "✖ Error al enviar";
    }
}

document.getElementById("texto").addEventListener("keydown", (e)=>{
    if(e.key === "Enter") enviar();
});

</script>

</body>
</html>
